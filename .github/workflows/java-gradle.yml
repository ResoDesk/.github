# Reusable: build and test a Gradle project. Testcontainers works (Docker is on the runner).
# Callers pin a tag: uses: ResoDesk/.github/.github/workflows/java-gradle.yml@v1
name: Java (Gradle)

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "25"
      gradle-args:
        type: string
        default: test
      timeout-minutes:
        type: number
        default: 20

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ${{ inputs.gradle-args }} --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
